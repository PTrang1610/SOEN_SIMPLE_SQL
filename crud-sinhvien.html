<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống quản lý sinh viên - CRUD Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EEF1F5;
    font-family:'Inter',sans-serif;
    color:#1F2937;
    padding:32px 16px;
  }
  .card{
    max-width:920px;
    margin:0 auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 24px rgba(15,23,42,0.08);
    padding:28px 32px 32px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0 0 20px;
    color:#111827;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:24px;
    font-size:14px;
  }
  thead th{
    text-align:left;
    padding:10px 12px;
    background:#F3F4F6;
    color:#374151;
    font-weight:600;
    border-bottom:2px solid #E5E7EB;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid #EEF0F3;
  }
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:#F9FAFB;}
  tbody tr.selected td{background:#DCEBFC;}

  .actions{display:flex; gap:10px; align-items:center;}
  .icon-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:15px;
    padding:2px;
    line-height:1;
  }
  .icon-edit{color:#2563EB;}
  .icon-delete{color:#DC2626;}
  .icon-btn:hover{opacity:0.7;}

  .form-section h2{
    font-size:15px;
    font-weight:700;
    margin:0 0 16px;
    color:#111827;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 20px;
    margin-bottom:20px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#374151;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:9px 12px;
    border:1px solid #D1D5DB;
    border-radius:7px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
    background:#fff;
  }
  .field input:focus{border-color:#2563EB; box-shadow:0 0 0 3px rgba(37,99,235,0.12);}

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
  }
  .btn{
    flex:1;
    min-width:170px;
    padding:11px 16px;
    border:none;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-select{background:#2563EB;}
  .btn-select:hover{background:#1D4ED8;}
  .btn-insert{background:#16A34A;}
  .btn-insert:hover{background:#15803D;}
  .btn-update{background:#F59E0B;}
  .btn-update:hover{background:#D97706;}
  .btn-delete{background:#DC2626;}
  .btn-delete:hover{background:#B91C1C;}

  .status{
    font-size:12.5px;
    margin-top:12px;
    padding:8px 12px;
    border-radius:6px;
    display:none;
  }
  .status.ok{display:block; background:#E9F5EA; color:#166534;}
  .status.err{display:block; background:#FDECEC; color:#B91C1C;}
</style>
</head>
<body>

<div class="card">
  <h1>HỆ THỐNG QUẢN LÝ SINH VIÊN - CRUD INTERFACE</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Họ và Tên</th>
        <th>Mã số sinh viên</th>
        <th>Địa chỉ</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div class="form-section">
    <h2>NHẬP/SỬA THÔNG TIN SINH VIÊN</h2>
    <div class="form-grid">
      <div class="field">
        <label>Mã số sinh viên</label>
        <input type="text" id="f-masv" placeholder="SV006">
      </div>
      <div class="field">
        <label>Họ và Tên</label>
        <input type="text" id="f-hoten" placeholder="Nguyễn Văn A">
      </div>
      <div class="field">
        <label>Lớp/Khoa</label>
        <input type="text" id="f-lopkhoa" placeholder="CNTT">
      </div>
      <div class="field">
        <label>Địa chỉ</label>
        <input type="text" id="f-diachi" placeholder="Hà Nội">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-select" id="btn-select">🔍 Hiển thị Dữ liệu (SELECT)</button>
      <button class="btn btn-insert" id="btn-insert">➕ Thêm mới (INSERT)</button>
      <button class="btn btn-update" id="btn-update">✎ Cập nhật (UPDATE)</button>
      <button class="btn btn-delete" id="btn-delete">🗑 Xóa dữ liệu (DELETE)</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
let db, SQL, selectedId = null;

const tbody = document.getElementById('table-body');
const statusEl = document.getElementById('status');
const fMaSV = document.getElementById('f-masv');
const fHoTen = document.getElementById('f-hoten');
const fLopKhoa = document.getElementById('f-lopkhoa');
const fDiaChi = document.getElementById('f-diachi');

function showStatus(kind, msg){
  statusEl.className = 'status ' + kind;
  statusEl.textContent = msg;
}

function initDb(){
  db = new SQL.Database();
  db.run(`
    CREATE TABLE SinhVien (
      ID INTEGER PRIMARY KEY AUTOINCREMENT,
      MaSV TEXT NOT NULL UNIQUE,
      HoTen TEXT NOT NULL,
      LopKhoa TEXT,
      DiaChi TEXT
    );
    INSERT INTO SinhVien (MaSV, HoTen, LopKhoa, DiaChi) VALUES
      ('SV001','Nguyễn Văn A','CNTT','Hà Nội'),
      ('SV002','Trần Thị B','CNTT','Đà Nẵng'),
      ('SV003','Lê Văn C','KTPM','TP.HCM'),
      ('SV004','Nguyễn Văn A','ATTT','Cần Thơ'),
      ('SV005','Trần Thị B','DE','Hải Phòng');
  `);
}

function fmtId(n){ return 'ID' + String(n).padStart(3,'0'); }

function renderTable(){
  const res = db.exec('SELECT ID, HoTen, MaSV, DiaChi, LopKhoa FROM SinhVien ORDER BY ID;');
  tbody.innerHTML = '';
  if(res.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#9CA3AF;padding:18px;">Không có dữ liệu</td></tr>';
    return;
  }
  res[0].values.forEach(row => {
    const [id, hoten, masv, diachi, lopkhoa] = row;
    const tr = document.createElement('tr');
    tr.dataset.id = id;
    if(id === selectedId) tr.classList.add('selected');
    tr.innerHTML = `
      <td>${fmtId(id)}</td>
      <td>${hoten}</td>
      <td>${masv}</td>
      <td>${diachi ?? ''}</td>
      <td class="actions">
        <button class="icon-btn icon-edit" title="Sửa">✏️</button>
        <button class="icon-btn icon-delete" title="Xóa">🗑️</button>
      </td>
    `;
    tr.addEventListener('click', (e) => {
      if(e.target.closest('.icon-delete')){
        deleteRow(id);
        return;
      }
      selectRow(id, masv, hoten, lopkhoa, diachi);
    });
    tbody.appendChild(tr);
  });
}

function selectRow(id, masv, hoten, lopkhoa, diachi){
  selectedId = id;
  fMaSV.value = masv;
  fHoTen.value = hoten;
  fLopKhoa.value = lopkhoa ?? '';
  fDiaChi.value = diachi ?? '';
  renderTable();
}

function clearForm(){
  selectedId = null;
  fMaSV.value = '';
  fHoTen.value = '';
  fLopKhoa.value = '';
  fDiaChi.value = '';
}

function deleteRow(id){
  try{
    db.run('DELETE FROM SinhVien WHERE ID = ?;', [id]);
    if(selectedId === id) clearForm();
    showStatus('ok', '✓ Đã xóa sinh viên ' + fmtId(id));
    renderTable();
  }catch(e){
    showStatus('err', '✗ Lỗi: ' + e.message);
  }
}

document.getElementById('btn-select').addEventListener('click', () => {
  renderTable();
  showStatus('ok', '✓ SELECT * FROM SinhVien — đã tải lại dữ liệu');
});

document.getElementById('btn-insert').addEventListener('click', () => {
  const masv = fMaSV.value.trim();
  const hoten = fHoTen.value.trim();
  if(!masv || !hoten){
    showStatus('err', '✗ Vui lòng nhập Mã số sinh viên và Họ và Tên');
    return;
  }
  try{
    db.run('INSERT INTO SinhVien (MaSV, HoTen, LopKhoa, DiaChi) VALUES (?,?,?,?);',
      [masv, hoten, fLopKhoa.value.trim(), fDiaChi.value.trim()]);
    showStatus('ok', '✓ Đã thêm sinh viên ' + masv);
    clearForm();
    renderTable();
  }catch(e){
    showStatus('err', '✗ Lỗi: ' + e.message + ' (Mã số sinh viên có thể đã tồn tại)');
  }
});

document.getElementById('btn-update').addEventListener('click', () => {
  if(selectedId === null){
    showStatus('err', '✗ Vui lòng chọn một dòng trong bảng để cập nhật');
    return;
  }
  const masv = fMaSV.value.trim();
  const hoten = fHoTen.value.trim();
  if(!masv || !hoten){
    showStatus('err', '✗ Vui lòng nhập Mã số sinh viên và Họ và Tên');
    return;
  }
  try{
    db.run('UPDATE SinhVien SET MaSV=?, HoTen=?, LopKhoa=?, DiaChi=? WHERE ID=?;',
      [masv, hoten, fLopKhoa.value.trim(), fDiaChi.value.trim(), selectedId]);
    showStatus('ok', '✓ Đã cập nhật ' + fmtId(selectedId));
    clearForm();
    renderTable();
  }catch(e){
    showStatus('err', '✗ Lỗi: ' + e.message);
  }
});

document.getElementById('btn-delete').addEventListener('click', () => {
  if(selectedId === null){
    showStatus('err', '✗ Vui lòng chọn một dòng trong bảng để xóa');
    return;
  }
  deleteRow(selectedId);
});

async function boot(){
  SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  initDb();
  renderTable();
}
boot();
</script>

</body>
</html>
